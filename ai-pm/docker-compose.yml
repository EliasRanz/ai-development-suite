services:
  # Shared infrastructure services (always needed)
  ai-pm-database:
    image: postgres:15
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AI_PM_DB_USER:-aipm}
      POSTGRES_PASSWORD: ${AI_PM_DB_PASSWORD:-aipm123}
      POSTGRES_DB: ${AI_PM_DB_NAME:-ai_project_manager}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    container_name: ai-tools-pm-database
    ports:
      - "5432:5432"

  # Production services
  ai-pm-api:
    profiles: ["production", "prod"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AI_PM_DB_HOST: ai-pm-database
      AI_PM_DB_PORT: "5432"
      AI_PM_DB_USER: ${AI_PM_DB_USER:-aipm}
      AI_PM_DB_PASSWORD: ${AI_PM_DB_PASSWORD:-aipm123}
      AI_PM_DB_NAME: ${AI_PM_DB_NAME:-ai_project_manager}
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      - ai-pm-database
    container_name: ai-tools-pm-api

  ai-pm-ui:
    profiles: ["production", "prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - ai-pm-api
    container_name: ai-tools-pm-ui

  # Development services (with hot reload)
  ai-pm-api-dev:
    profiles: ["development", "dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      AI_PM_DB_HOST: ai-pm-database
      AI_PM_DB_PORT: "5432"
      AI_PM_DB_USER: ${AI_PM_DB_USER:-aipm}
      AI_PM_DB_PASSWORD: ${AI_PM_DB_PASSWORD:-aipm123}
      AI_PM_DB_NAME: ${AI_PM_DB_NAME:-ai_project_manager}
      PORT: "8000"
      AIR_ENABLED: "true"
      ENVIRONMENT: "development"
      APP_VERSION: "dev-hotreload"
      BUILD_TIME: "dynamic"
    ports:
      - "8001:8000"
    depends_on:
      - ai-pm-database
    container_name: ai-tools-pm-api-dev
    volumes:
      # Mount source code for hot reload
      - ./backend:/app:delegated
      - /app/tmp  # Air build cache directory

  ai-pm-ui-dev:
    profiles: ["development", "dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8001/api
      CHOKIDAR_USEPOLLING: "true"  # For Docker file watching
    ports:
      - "3002:3000"
    depends_on:
      - ai-pm-api-dev
    container_name: ai-tools-pm-ui-dev
    volumes:
      # Mount source code for HMR
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      - ./frontend/package.json:/app/package.json:delegated
      - ./frontend/vite.config.ts:/app/vite.config.ts:delegated
      - ./frontend/tsconfig.json:/app/tsconfig.json:delegated
      - ./frontend/index.html:/app/index.html:delegated
